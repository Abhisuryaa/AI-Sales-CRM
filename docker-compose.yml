name: ai-sales-crm

services:
  postgres:
    image: postgres:18-alpine
    container_name: ai-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_sales_crm
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_sales_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ai-crm-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  agents:
    build:
      context: ./services/agents
      dockerfile: Dockerfile
    image: ai-crm-agents
    container_name: ai-crm-agents
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_sales_crm
      REDIS_URL: redis://redis:6379/0
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: ai-crm-web
    container_name: ai-crm-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_sales_crm
      AGENTS_API_URL: http://agents:8000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-please-change-me-32-chars-minimum-long}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      agents:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    container_name: ai-crm-n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      # $env.WEBHOOK_SECRET is read by workflow expressions.
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-dev-webhook-secret}
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/import/workflows:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /home/node/.n8n/.workflows-imported ] && ls /import/workflows/*.json >/dev/null 2>&1; then
          echo "Importing workflows from /import/workflows..."
          n8n import:workflow --separate --input=/import/workflows
          touch /home/node/.n8n/.workflows-imported
        fi
        exec n8n
    depends_on:
      agents:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  n8n-data:
